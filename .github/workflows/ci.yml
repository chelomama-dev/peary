name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Locked: the build uses exactly the versions in packages.lock.json. NuGet Audit runs here too, and in CI
      # high and critical advisories fail it (see Directory.Build.props)
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The API tests start SQL Server with Testcontainers; the runner has Docker
      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Backend tests
          path: TestResults/*.trx
          reporter: dotnet-trx

  # Required by the ruleset on main, like backend. Until mobile/ exists every step after the first is skipped and
  # the job passes, so backend-only PRs can merge
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect the app
        id: app
        working-directory: .
        run: |
          if [[ -f mobile/pubspec.yaml ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      # Gradle needs a JDK to build the APK; the runner already has the Android SDK
      - name: Setup Java
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The same Flutter as on the development machine
      - name: Setup Flutter
        if: steps.app.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # Flutter's NDK, from the cache: Gradle's own download of it has no time limit
      - name: Android NDK
        if: steps.app.outputs.exists == 'true'
        uses: ./.github/actions/android-ndk

      - name: Install
        if: steps.app.outputs.exists == 'true'
        run: flutter pub get --enforce-lockfile

      # json_serializable's *.g.dart files are not committed
      - name: Generate code
        if: steps.app.outputs.exists == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: steps.app.outputs.exists == 'true'
        run: flutter analyze --fatal-infos

      - name: Test
        if: steps.app.outputs.exists == 'true'
        run: flutter test

      # Catches Android build problems (Gradle, manifest, resources) on every PR
      - name: Build debug APK
        if: steps.app.outputs.exists == 'true'
        run: flutter build apk --debug --dart-define=DEMO=true
